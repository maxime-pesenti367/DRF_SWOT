name: my_all_sats_1hz_2_days_unnormalised

product_type: my
satellites: all
freq: 1hz
time_znormalised: false   # keep timestamp continuous but NOT z-scored -- stored as days since 2000-01-01 00:00 instead. Omit/true = old z-scored behaviour.

start_date: "2025-05-31"
end_date: "2025-06-02"
variables: ["sla_filtered"]

splits:
  - name: random
    method: random
    train: 0.70
    val: 0.15
    test: 0.15
    seed: 42
