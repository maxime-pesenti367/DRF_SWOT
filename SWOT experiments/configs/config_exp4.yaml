data:
  # Point this to the exact location where store_tensors() saved your dictionary
  tensor_data_path: 'G:/My Drive/SWOT Project/data/pytorch tensors/small_experimentcd.pt'

device: 'cuda'

model:
  name: 'DeepMaternRandomPhaseS2RFFNN'
  num_layers: 3
  hidden_dim: 1000
  bottleneck_dim: 128
  output_dim: 1
  spatial_layer_type: 'MaternRandomPhaseS2RFFLayer'
  temporal_layer_type: 'Matern'
  lon_lat_inputs: True
  skip_connections: False
  combine_type: 'concat'
  kwargs:
    nu: 1.5

bayesian_optimization:
  # Note: I increased these from 1 to give you actual optimization. 
  # (1 is usually just used to test if the code compiles without crashing).
  n_iterations: 1
  initial_samples: 5
  bounds:
    - [1e-5, 0.1]  # spatial_lengthscale
    - [1e-5, 10]   # temporal_lengthscale
    - [1e-5, 1]    # amplitude
    - [1e-5, 10]   # lengthscale2
    - [1e-5, 1]    # amplitude2

uq_method:
  type: 'deep_ensemble'

training:
  # Increased from 1 so the network actually learns the data patterns
  num_epochs: 1
  batch_size: 8000
  learning_rate: 0.1
  num_models: 5
  p_weight: 0.95

results:
  # Ensure the folder "results/exp4/" exists in your directory before running
  csv_filename: 'results/exp4/results.csv'
  predictions_filename: 'results/exp4/final_predictions.pt'
  variance_filename: 'results/exp4/final_variance.pt'
  plot_mean_filename: 'results/exp4/final_mean.png'
  plot_variance_filename: 'results/exp4/final_variance.png'
  individual_predictions_filename: 'results/exp4/individual_final_predictions.pt'