data:
  experiment_name: 'all_sats_15_day'
  split_name: 'random'

device: 'cuda'

# Seeds only the Bayesian-optimization search (initial hyperparameter
# guesses + acquisition-function random restarts) -- NOT the per-ensemble-
# member training, which stays randomized across seeds 0..num_models-1 by
# design (that's what gives the deep ensemble its uncertainty estimate).
seed: 42

model:
  name: 'DeepMaternRandomPhaseS2RFFNN'
  num_layers: 3
  hidden_dim: 1000
  bottleneck_dim: 128
  output_dim: 1
  lon_lat_inputs: True
  combine_type: 'concat'
  kwargs:
    nu: 1.5

bayesian_optimization:
  n_iterations: 3
  initial_samples: 3
  bounds:
    - [1e-5, 0.1]  # spatial_lengthscale
    - [1e-5, 10]   # temporal_lengthscale
    - [1e-5, 1]    # amplitude
    - [1e-5, 10]   # lengthscale2
    - [1e-5, 1]    # amplitude2

uq_method:
  type: 'deep_ensemble'

training:
  num_epochs: 10
  batch_size: 8000
  learning_rate: 0.1
  num_models: 5
  # Caps how many of the 5 ensemble members train concurrently per BO
  # round -- each concurrent worker holds its own GPU memory, so this
  # bounds peak VRAM to ~1x a single model instead of ~5x. Set to 1 for
  # fully sequential (slowest, safest); raise it (e.g. to num_models) if
  # you land on a GPU with enough headroom to go faster.
  max_parallel_models: 5
  p_weight: 0.95
  # The three opt-in features from spherical_uq_methods_SWOT.py -- absent
  # from every other exp5 config, so this is the first run to exercise them.
  # Added directly in response to exp_all_sats_15_day_random_10_epochs_long's
  # training curve, whose final ensemble spiked into multi-epoch instability
  # around epochs 6-9 despite converging cleanly through epoch 5.
  early_stopping:
    patience: 3
  lr_scheduler:
    type: cosine
  gradient_clipping:
    max_norm: 1.0
